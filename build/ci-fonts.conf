<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Standard matching with desktop TTF/TTC fonts, excluding unsupported web fonts. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <reset-dirs/>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/opentype/noto</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>.AppleSystemUIFont</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK SC</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
