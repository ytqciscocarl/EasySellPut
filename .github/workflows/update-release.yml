name: Release · Prepare draft
run-name: "Prepare release · main · CI ${{ inputs.ci_run_id || github.event.workflow_run.id }}"
on:
  workflow_run:
    workflows: ['CI · Test & Package']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push CI run for the current main commit
        required: true
        type: string
      notes:
        description: User-facing notes (optional; defaults to commit message)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  source:
    name: Verify main & CI
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
      run_id: ${{ steps.tested.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify CI source & all packages
        id: tested
        run: python3 build/release/policy.py --run-id "$RUN_ID" --output "$RUNNER_TEMP/release-source.json"
      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: Release-source-plan
          path: ${{ runner.temp }}/release-source.json
          if-no-files-found: error

  packages:
    name: ${{ matrix.label }} · Sign & Verify
    if: github.ref == 'refs/heads/main'
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            label: Linux x64
            desktop: ''
          - os: windows-latest
            rid: win-x64
            label: Windows x64
            desktop: Desktop-windows-latest
          - os: windows-11-arm
            rid: win-arm64
            label: Windows ARM64
            desktop: Desktop-windows-11-arm
          - os: macos-15-intel
            rid: osx-x64
            label: Mac Intel
            desktop: Desktop-macos-15-intel
          - os: macos-26
            rid: osx-arm64
            label: Mac Apple Silicon
            desktop: Desktop-macos-26
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.source.outputs.run_id }}
      RID: ${{ matrix.rid }}
      DESKTOP_ARTIFACT: ${{ matrix.desktop }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download tested CI packages
        run: |
          gh run download $env:RUN_ID --repo $env:GITHUB_REPOSITORY --name "CLI-MCP-$env:RID" --dir "$env:RUNNER_TEMP/input/cli"
          if ($LASTEXITCODE -ne 0) { throw 'CLI artifact download failed' }
          if ($env:DESKTOP_ARTIFACT) {
            gh run download $env:RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:DESKTOP_ARTIFACT --dir "$env:RUNNER_TEMP/input/desktop"
            if ($LASTEXITCODE -ne 0) { throw 'Desktop artifact download failed' }
          }
      - name: Sign & notarize packages
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_P12_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_NOTARY_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_NOTARY_KEY_P8 || '' }}
          APPLE_NOTARY_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_NOTARY_ISSUER || '' }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          python build/release/sign-packages.py --packages "$env:RUNNER_TEMP/input" --output build/out/release --rid $env:RID --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Platform signing/notarization failed; unsigned fallback is prohibited' }
      - name: Test final signed packages
        run: |
          $hostRid = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $hostRid += '-' + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($hostRid -ne $env:RID) { throw 'Native release runner architecture mismatch' }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $extension = if ($IsWindows) { '.zip' } else { '.tar.gz' }
          $cli = "build/out/release/EasySellPut-CLI-$version-$env:RID$extension"
          $destination = 'build/out/release cli extracted with spaces'
          python tests/automation/check_cli_package.py --archive $cli --rid $env:RID --extract-to $destination
          if ($LASTEXITCODE -ne 0) { throw 'Signed CLI package verification failed' }
          $binary = if ($IsWindows) { 'easysellput.exe' } else { 'easysellput' }
          $executable = Join-Path (Join-Path $destination "EasySellPut-CLI-$version-$env:RID") $binary
          python tests/automation/cli_mcp_smoke.py --executable $executable
          if ($LASTEXITCODE -ne 0) { throw 'Final CLI/MCP smoke failed' }
          if ($env:DESKTOP_ARTIFACT) {
            python tests/automation/check_desktop_package.py --archive "build/out/release/EasySellPut-Desktop-$version-$env:RID.zip" --rid $env:RID --extract-to 'build/out/release desktop extracted with spaces'
            if ($LASTEXITCODE -ne 0) { throw 'Signed GUI, updater or bundled automation failed' }
          }
          if ($IsMacOS) {
            $app = (Get-ChildItem 'build/out/release desktop extracted with spaces' -Recurse -Filter EasySellPut.app -Directory | Select-Object -First 1).FullName
            xcrun stapler validate $app
            if ($LASTEXITCODE -ne 0) { throw 'Extracted app lost its notarization ticket' }
            spctl --assess --type execute $app
            if ($LASTEXITCODE -ne 0) { throw 'Extracted app Gatekeeper validation failed' }
          }
      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.rid }}
          path: build/out/release/*
          if-no-files-found: error
      - name: Upload package test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.rid }}
          path: build/out/desktop-smoke*.json
          if-no-files-found: ignore

  draft:
    name: Create release draft
    needs: [source, packages]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.source.outputs.run_id }}
      TESTED_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Recheck main & CI
        run: |
          python3 build/release/policy.py --run-id "$RUN_ID" --output "$RUNNER_TEMP/release-source.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/release-source.json"))["sourceCommit"]==os.environ["TESTED_SHA"]'
      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          pattern: Release-*
          path: ${{ runner.temp }}/release-packages
      - name: Assemble release assets
        id: manifest
        run: python3 build/release/assemble.py --packages "$RUNNER_TEMP/release-packages" --plan "$RUNNER_TEMP/release-source.json" --output "$RUNNER_TEMP/release-assets"
      - name: Sign update & release indexes
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo 'Configure UPDATE_SIGNING_KEY matching the pinned public key.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          for index in EasySellPut-update.json EasySellPut-release.json; do
            openssl dgst -sha256 -sign "$key" -out "$RUNNER_TEMP/release-assets/$index.sig" "$RUNNER_TEMP/release-assets/$index"
            openssl dgst -sha256 -verify src/Meili.Application/Updates/update-public-key.pem -signature "$RUNNER_TEMP/release-assets/$index.sig" "$RUNNER_TEMP/release-assets/$index"
          done
      - name: Create main tag & draft
        env:
          TAG: v${{ steps.manifest.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0,'build/release')
          from policy import current_main, require
          require(current_main(os.environ['GITHUB_REPOSITORY'])==os.environ['TESTED_SHA'],'main advanced before draft creation')
          notes=os.environ['RELEASE_NOTES'] or subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+os.environ['TESTED_SHA'],'--jq','.commit.message'],text=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'release-notes.md').write_text(notes+'\n\nSource: '+os.environ['TESTED_SHA']+'\nCI run: '+os.environ['RUN_ID']+'\n',encoding='utf-8')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Version already exists; bump Version for a new release. No overwrite.'; exit 1; fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if test -n "$existing"; then
            test "$existing" = "$TESTED_SHA" || { echo 'Existing tag differs from tested main.'; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$TESTED_SHA"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "EasySellPut $TAG" --draft --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets/"*
